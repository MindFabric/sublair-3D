services:
  # Main application (Node.js + RTMP + WebSocket)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sublair3d-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - RTMP_PORT=1935
    ports:
      - "3000:3000"   # Express API + WebSocket
      - "1935:1935"   # RTMP streaming input
      - "8888:8888"   # HTTP-FLV streaming output
    volumes:
      - ./media:/app/media  # Persist media files
      - ./logs:/app/logs    # Persist logs
    networks:
      - sublair-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx reverse proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: sublair3d-nginx
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP
      - "443:443"   # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - .:/var/www/html:ro  # Mount entire project directory
      - ./ssl:/etc/nginx/ssl:ro  # Cloudflare Origin SSL certificates
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - sublair-network
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot
    container_name: sublair3d-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  sublair-network:
    driver: bridge

volumes:
  media:
  logs:
